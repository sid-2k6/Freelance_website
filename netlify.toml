# =====================================================================
# Netlify configuration for TechNova Solutions
# Deploys entirely on the Netlify free tier — no server, no paid add-ons.
# =====================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: every route is served by index.html so React Router works
# on hard refresh and deep links (e.g. /admin/projects, /services/nlp).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-cache hashed static assets produced by Vite.
# These filenames contain a content hash, so they can be cached forever —
# a code change produces a new filename that browsers must re-download.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache the HTML entry point. index.html references the current
# hashed JS/CSS bundles, so browsers must always re-fetch it to discover
# the latest build. This prevents returning visitors from being served a
# stale app after a new deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Apply the same no-cache policy to the root path.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
